spring.application.name=empleados-api

# Conexión a MongoDB (el contenedor empleados-mongo de compose.yaml).
# authSource=admin: el usuario academia se creó en la base admin (es el usuario raíz del contenedor)
spring.mongodb.uri=mongodb://academia:academia123@localhost:27017/empleados_db?authSource=admin

# Crea al arrancar los índices de @Indexed (sin esto, el email NO es único en la base)
spring.data.mongodb.auto-index-creation=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Paginación: aunque el cliente pida size=1000, nunca se devuelven más de 50 por página
spring.data.web.pageable.max-page-size=50