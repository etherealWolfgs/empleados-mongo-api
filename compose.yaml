services:
  mongo:
    image: mongo:8.2                  # fija: 8.3 y 8.0 NO arrancan con kernels de Linux 6.19 o más nuevos
    container_name: empleados-mongo
    restart: unless-stopped           # si WSL se apaga, al volver a abrir Ubuntu arranca solo
    environment:
      MONGO_INITDB_ROOT_USERNAME: academia
      MONGO_INITDB_ROOT_PASSWORD: academia123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "academia", "-p", "academia123", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  dbgate:
    image: dbgate/dbgate:7.3.1        # cliente gráfico web: http://localhost:3000
    container_name: empleados-dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: mongo
      LABEL_mongo: MongoDB (empleados)
      URL_mongo: mongodb://academia:academia123@mongo:27017/?authSource=admin
      ENGINE_mongo: mongo@dbgate-plugin-mongo
    ports:
      - "127.0.0.1:3000:3000"         # solo en tu máquina: DbGate no pide contraseña
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data: